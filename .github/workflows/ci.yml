name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Typecheck renderer & Electron main/preload
        run: npm run typecheck

      - name: Build renderer & Electron bundles
        run: npm run build

      - name: Verify dot-stash browser bundle in dist/
        run: |
          test -f dist/dot-stash/dot-stash.esm.js
          ls dist/dot-stash/*.entry.js | head -n 5
          grep -q 'dot-stash/dot-stash.esm.js' dist/index.html
